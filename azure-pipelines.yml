# Run only from Azure DevOps via the "Run pipeline" button.
trigger: none
pr: none

variables:
  vmImage: ubuntu-latest
  # Define these in Azure DevOps (or a variable group); do not put subscription IDs or credentials here.
  azureServiceConnection: azure-dev-connection
  resourceGroupName: rg-sample
  location: eastus

stages:
  - stage: Validate
    displayName: Validate Bicep
    jobs:
      - job: Build
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Build and lint Bicep
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az bicep build --file main.bicep --outdir $(Build.ArtifactStagingDirectory)

  - stage: Deploy
    displayName: What-if and deploy
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployInfrastructure
        displayName: Deploy practice infrastructure
        environment: practice
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Create resource group, preview, and deploy
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Checking required Azure resource providers..."
                      missing_providers=()
                      for provider in Microsoft.KeyVault Microsoft.Network Microsoft.Storage; do
                        registration_state="$(az provider show --namespace "$provider" --query registrationState --output tsv)"
                        if [ "$registration_state" != "Registered" ]; then
                          missing_providers+=("$provider")
                        fi
                      done
                      if [ "${#missing_providers[@]}" -gt 0 ]; then
                        echo "ERROR: Required resource providers are not registered: ${missing_providers[*]}"
                        echo "Ask a subscription Owner to register them once, then rerun this pipeline."
                        exit 1
                      fi
                      echo "Creating or updating resource group..."
                      az group create --name "$(resourceGroupName)" --location "$(location)"
                      echo "Running What-If preview..."
                      az deployment group what-if \
                        --name "practice-$(Build.BuildId)" \
                        --resource-group "$(resourceGroupName)" \
                        --validation-level Template \
                        --parameters parameters/main.bicepparam
                      echo "What-If completed. Starting deployment..."
                      az deployment group create \
                        --name "practice-$(Build.BuildId)" \
                        --resource-group "$(resourceGroupName)" \
                        --parameters parameters/main.bicepparam
